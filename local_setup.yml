- hosts: localhost
  connection: local
  tasks:
    - name: Create FinanceFlow project directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ansible_env.HOME }}/FinanceFlow"
        - "{{ ansible_env.HOME }}/FinanceFlow/terraform"
        - "{{ ansible_env.HOME }}/FinanceFlow/k8s"
