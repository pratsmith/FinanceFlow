name: FinanceFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-build-and-scan:
    name: CI - Lint, Build & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10 & Verify Syntax
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check Python Code Compilation
        run: python3 -m py_compile finance_app.py

      - name: 3. Build Docker Image
        run: docker build -t financeflow:${{ github.sha }} .

      - name: 4. Run Trivy Security Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'financeflow:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  cd-manifest-validation:
    name: CD - Validate Kubernetes & Terraform Configs
    needs: ci-build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Validate Terraform Syntax
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init & Validate
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: 3. Dry-Run Validate Kubernetes Manifest
        run: |
          grep -q "kind: Deployment" k8s/deploy.yaml
          grep -q "kind: Service" k8s/deploy.yaml
          echo "Kubernetes manifests verified and ready for Minikube deployment."
